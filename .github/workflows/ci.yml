name: CI - Test & Quality Gates

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  PYTHONIOENCODING: "utf-8"

jobs:
  test-python:
    name: Run Python Security & Cryptographic Tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest ]
        python-version: [ "3.12", "3.13" ]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate Brand Assets
        run: |
          python assets_gen.py

      - name: Execute Full Cryptographic & Security Test Suite
        run: |
          python -m unittest discover -p "test_*.py"

  verify-dart:
    name: Verify Dart / Flutter Codebase
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dart & Flutter Dependencies
        run: |
          cd flutter_mobile
          flutter pub get

      - name: Build and Verify Android Release APK
        run: |
          cd flutter_mobile
          chmod +x android/gradlew
          flutter pub get
          flutter build apk --release --android-skip-build-dependency-validation
          ls -lh build/app/outputs/flutter-apk/app-release.apk
